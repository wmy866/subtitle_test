<!DOCTYPE html>  <!-- 檔案屬性為html5 -->  
<html lang="zh-TW">  <!-- html是網頁的根元素，lang屬性指定語言 -->

<head>  <!-- head是html的頭部，裡面放置網頁的元數據 -->
    <meta charset="UTF-8">  <!-- meta是元數據元素，charset屬性指定字元編碼 -->
    <title>臺灣牛的中字網站</title>  <!-- title是網頁的標題，會顯示在瀏覽器的標籤上 -->
</head>

<body>  <!-- body是html的主體，裡面放置網頁的內容 -->
    <h1>[特效繁中] i'M THE TREND EP. 5</h1>  <!-- h1是標題元素，表示網頁的主要標題 -->

    <!-- iframe是內嵌框架元素，用來嵌入其他網頁或影片 -->
    <!-- 原連結為...com/watch?v=mMg0PV3FAfE，v=後為影片ID -->
    <iframe
        src="https://www.youtube.com/embed/DYgE3SGPEqk"
        width="1280"
        height="720">
    </iframe>
</body>

</html>
