<!-- html模板、網頁標題、手動內嵌 -->
<!-- TEST OK -->
<!DOCTYPE html>  <!-- 檔案屬性html5 -->  
<html lang="zh-TW">  <!-- html是網頁根元素，lang屬性指定語言 -->

<head>  <!-- html的頭部，放網頁的元數據 -->
    <meta charset="UTF-8">  <!-- meta是元數據元素，charset屬性指定字元編碼 -->
    <title>臺灣牛的中字網站 - iframe</title>  <!-- 網頁標題，顯示在瀏覽器標籤上 -->
</head>

<body>  <!-- html的主體，放網頁顯示的內容 -->
    <h1>[特效繁中] i'M THE TREND EP. 5</h1>  <!-- 標題元素，顯示主要標題 -->

    <!-- iframe是內嵌框架元素，用來嵌入其他網頁或影片 -->
    <!-- 原連結為...com/watch?v=mMg0PV3FAfE，v=後為影片ID -->
    <iframe
        src="https://www.youtube.com/embed/DYgE3SGPEqk"
        width="1280"
        height="720">
    </iframe>
</body>

</html>
