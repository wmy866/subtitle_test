<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>臺灣牛的中字網站 - YT API</title>
    <script src="https://www.youtube.com/iframe_api"></script>  <!-- 導入YT API -->
    <script src="video_script.js"></script>  <!-- 導入自己JS檔 -->
</head>

<style>
    .video-container {
        background-color: pink;  /*方便確認容器範圍(暫時設定)*/
        position: relative;
        width: 1280px;
        height: 720px;
    }

    .subtitle {
        position: absolute;
        bottom: 10%;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        background-color: rgba(0, 0, 0, 0.5);
        padding: 5px 10px;
        font-size: 24px;
    }

    #player {
        width: 100%;  /*影片寬度同影片容器寬度調整*/
        height: 100%;  /*影片高度同影片容器高度調整*/
    }
</style>

<body>
    <h1>[特效中字]i-dle [Syncopation] 世巡花絮 Behind the Rhythm</h1>
    <div class="video-container">
        <!--<iframe
            src="https://www.youtube.com/embed/mMg0PV3FAfE"
            width="1280"
            height="720">
        </iframe>-->

        <div id="player"></div>  <!-- 透過JS導入YT API放影片的容器 -->

        <div class="subtitle">
            世巡海外首場是台北大巨蛋!
        </div>
    </div>
</body>

</html>
