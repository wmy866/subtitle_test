<!-- 影片容器置中、影片同影片容器大小並隨視窗調整但固定16:9 -->
<!-- 標題隨視窗大小跳行 -->
<!-- TESTing -->
<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>臺灣牛的中字網站 - 畫面大小活動(CSS)</title>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="video_script.js"></script>

    <style>
        .video-inform {
            background-color: purple;  /*(暫時設定)*/
            width: 96%;
            height: 90%;
            margin: auto;
        }

        h1 {
            width: 90%;  /*標題寬度為視窗寬度的90%*/
            font-size: clamp(24px, 3vw, 128px);  /*vw=viewport width，標題字體大小隨視窗寬度調整(5%)*/
            margin: 0 auto;  /*外距，使水平置中*/
            font-weight: bold;  /*粗體*/
        }

        .video-container {
            background-color: red;  /*(暫時設定)*/
            position: relative;
            width: 90%;  /*影片容器寬度為影片資訊容器寬度的90%*/
            aspect-ratio: 16/9;  /*影片容器寬高比固定16:9縮放*/
            margin: 0 auto; 
            /*height: 360px;*/
        }

        .subtitle {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background-color: rgb(0, 0, 0);
            padding: 5px 10px;  /*內距*/
            /*font-size: 24px;*/
        }

        #player {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div class="video-inform">
        <h1>[特效中字]i-dle [Syncopation] 世巡花絮 Behind the Rhythm</h1>
        <div class="video-container">
            <div id="player"></div>
            <div class="subtitle">
                世巡海外首場是台北大巨蛋!
            </div>
        </div>
    </div>
</body>

</html>
